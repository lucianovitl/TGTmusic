<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#1ED760"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.15">
    <rect width="512" height="512" rx="100" fill="url(#pattern)"/>
  </g>

  <!-- TGT Text Logo -->
  <text x="256" y="320"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="180"
        font-weight="800"
        fill="url(#textGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-8">
    TGT
  </text>

  <!-- Music note accent -->
  <g transform="translate(420, 100) rotate(-15)">
    <path d="M0 0 L0 -40 M0 -40 C15 -40 20 -30 20 -20 C20 -10 15 0 0 0"
          stroke="url(#textGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="url(#textGrad)" opacity="0.9"/>
    <circle cx="20" cy="-20" r="10" fill="url(#textGrad)" opacity="0.9"/>
  </g>

  <!-- Small decorative elements -->
  <circle cx="448" cy="64" r="28" fill="white" opacity="0.15"/>
  <circle cx="64" cy="448" r="22" fill="white" opacity="0.1"/>

  <defs>
    <pattern id="pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="white"/>
    </pattern>
  </defs>
</svg>