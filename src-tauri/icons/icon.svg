<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App brand gradient background - lime to lavender -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4f07a"/>
      <stop offset="50%" stop-color="#ff754e"/>
      <stop offset="100%" stop-color="#b69bff"/>
    </linearGradient>
    <!-- Text gradient - hero paper to white -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Accent gradient for music note -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b4"/>
      <stop offset="100%" stop-color="#c4f07a"/>
    </linearGradient>
    <!-- Subtle pattern -->
    <pattern id="pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="white" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background rounded square with brand gradient -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.12">
    <rect width="512" height="512" rx="100" fill="url(#pattern)"/>
  </g>

  <!-- Subtle inner glow -->
  <rect width="480" height="480" x="16" y="16" rx="90" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3"/>

  <!-- TGT Text Logo -->
  <text x="256" y="320"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="180"
        font-weight="800"
        fill="url(#textGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-8"
        paint-order="stroke fill"
        stroke="#000000"
        stroke-width="0.5"
        stroke-opacity="0.3">
    TGT
  </text>

  <!-- Music note accent - using brand colors -->
  <g transform="translate(420, 100) rotate(-15)">
    <path d="M0 0 L0 -40 M0 -40 C15 -40 20 -30 20 -20 C20 -10 15 0 0 0"
          stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <circle cx="0" cy="0" r="10" fill="url(#accentGrad)" opacity="0.95"/>
    <circle cx="20" cy="-20" r="10" fill="url(#accentGrad)" opacity="0.95"/>
  </g>

  <!-- Small decorative elements with brand colors -->
  <circle cx="448" cy="64" r="28" fill="#c4f07a" opacity="0.2"/>
  <circle cx="64" cy="448" r="22" fill="#b69bff" opacity="015"/>
  <circle cx="460" cy="460" r="18" fill="#ff754e" opacity="0.12"/>
</svg>